# Gerado automaticamente a partir da app FastAPI (app.main:app). NAO editar a mao.
# Fonte da verdade = codigo (rotas + schemas Pydantic). Para regenerar:
#   .venv/bin/python scripts/export_openapi.py
# Documentacao interativa em runtime: /docs (Swagger UI) e /redoc.
openapi: 3.1.0
info:
  title: aperIA - Python API
  description: '

    API do **aperIA** — ASPM (Application Security Posture Management) open-source.


    Um webhook de Pull Request do GitHub dispara um pipeline de scanners de

    segurança em 3 tiers (via Celery). O Claude raciocina como atacante

    (correlaciona findings, monta attack paths) e entrega patches como

    **GitHub code suggestions** para aprovação humana.


    > **Premissa inviolável:** o aperIA **nunca** aplica código sozinho.

    > Todo patch sai como code suggestion para aprovação humana.

    '
  contact:
    name: aperIA
  license:
    name: Open Source
  version: 1.0.0
paths:
  /health:
    get:
      tags:
      - health
      summary: Healthcheck
      description: 'Retorna o estado de disponibilidade do serviço.


        Usado por orquestradores/load balancers. Não verifica dependências

        externas (banco, Redis) — responde `200` enquanto o processo estiver vivo.'
      operationId: health_health_get
      responses:
        '200':
          description: Serviço no ar.
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
              example:
                status: ok
  /users:
    post:
      tags:
      - users
      summary: Criar usuário
      description: 'Cria um novo usuário.


        A senha (mínimo 8 caracteres) é armazenada com hash Argon2 e o e-mail

        deve ser único. Retorna apenas o `id` do usuário recém-criado.'
      operationId: create_user_users_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
        required: true
      responses:
        '201':
          description: Usuário criado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreatedResponse'
        '400':
          description: Erro de validação de domínio.
          content:
            application/json:
              example:
                detail: E-mail invalido
        '409':
          description: E-mail já cadastrado.
          content:
            application/json:
              example:
                detail: E-mail já cadastrado
        '500':
          description: 'Erro interno (ex.: falha de permissão no banco).'
          content:
            application/json:
              example:
                detail: Internal server error
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /users/{user_id}:
    get:
      tags:
      - users
      summary: Consultar usuário por ID
      description: Retorna os dados públicos de um usuário a partir do seu UUID.
      operationId: get_user_users__user_id__get
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      responses:
        '200':
          description: Usuário encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: Usuário não encontrado.
          content:
            application/json:
              example:
                detail: Usuário não encontrado
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/login:
    post:
      tags:
      - auth
      summary: Login
      description: 'Autentica o usuario e retorna um par access_token + refresh_token.


        - access_token: JWT de curta duracao (15 min por padrao)

        - refresh_token: token opaco de longa duracao (7 dias por padrao)'
      operationId: login_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Autenticação bem-sucedida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Credenciais inválidas ou token expirado/revogado/reusado.
          content:
            application/json:
              example:
                detail: Credenciais invalidas ou token expirado.
        '500':
          description: Erro interno ao acessar o banco.
          content:
            application/json:
              example:
                detail: Internal server error
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/refresh:
    post:
      tags:
      - auth
      summary: Renovar tokens (rotação)
      description: 'Troca um refresh_token valido por um novo par de tokens (rotacao).


        Se o refresh_token ja tiver sido usado anteriormente (reuso suspeito),

        toda a familia de tokens e invalidada.'
      operationId: refresh_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Novo par de tokens emitido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Credenciais inválidas ou token expirado/revogado/reusado.
          content:
            application/json:
              example:
                detail: Credenciais invalidas ou token expirado.
        '500':
          description: Erro interno ao acessar o banco.
          content:
            application/json:
              example:
                detail: Internal server error
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/logout:
    post:
      tags:
      - auth
      summary: Logout
      description: 'Invalida o refresh_token fornecido.

        Sempre retorna 204, mesmo se o token ja estiver invalido (evita oracle).'
      operationId: logout_auth_logout_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '204':
          description: Token revogado (ou já inválido). Sem corpo de resposta.
        '500':
          description: Erro interno ao acessar o banco.
          content:
            application/json:
              example:
                detail: Internal server error
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /findings:
    get:
      tags:
      - findings
      summary: Listar findings
      description: 'Lista findings do USUÁRIO logado, com filtros opcionais e paginacao.


        Isolado por dono: só retorna findings de commits cujos scans pertencem ao

        usuário autenticado. Ordenados do mais recente para o mais antigo; o campo

        `raw_output` é omitido aqui — use `GET /findings/{finding_id}` para o detalhe.'
      operationId: list_findings_findings_get
      security:
      - HTTPBearer: []
      parameters:
      - name: commit_sha
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filtra pelo SHA do commit.
          title: Commit Sha
        description: Filtra pelo SHA do commit.
      - name: severity
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/FindingSeverity'
          - type: 'null'
          description: Filtra pela severidade.
          title: Severity
        description: Filtra pela severidade.
      - name: tier
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 3
            minimum: 1
          - type: 'null'
          description: Filtra pelo tier (1-3).
          title: Tier
        description: Filtra pelo tier (1-3).
      - name: source
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Filtra pela ferramenta de origem (ex.: semgrep).'
          title: Source
        description: 'Filtra pela ferramenta de origem (ex.: semgrep).'
      - name: secret_verified
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Filtra secrets verificados.
          title: Secret Verified
        description: Filtra secrets verificados.
      - name: title
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filtra pelo titulo EXATO. E o drill-down de um grupo de `GET /findings/groups`
            — nao e busca por texto livre.
          title: Title
        description: Filtra pelo titulo EXATO. E o drill-down de um grupo de `GET /findings/groups` —
          nao e busca por texto livre.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          description: Tamanho da pagina.
          default: 50
          title: Limit
        description: Tamanho da pagina.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Deslocamento para paginacao.
          default: 0
          title: Offset
        description: Deslocamento para paginacao.
      responses:
        '200':
          description: Pagina de findings que atendem aos filtros.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingPage'
        '401':
          description: Token ausente, invalido ou expirado.
          content:
            application/json:
              example:
                detail: Credenciais invalidas ou token expirado.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /findings/groups:
    get:
      tags:
      - findings
      summary: Listar findings agrupados por tipo
      description: 'Agrupa os findings do usuario por tipo de vulnerabilidade.


        Existe porque a listagem plana e'' ilegivel com DAST: o mesmo alerta do ZAP

        aparece uma vez por rota, e um scan vira milhares de linhas que sao dezenas

        de problemas. Aqui cada linha e'' um problema, com quantas vezes ele ocorre e

        em quantos caminhos distintos.


        Sem paginacao de proposito: o agrupamento derruba a cardinalidade em tres

        ordens de grandeza (12 mil findings -> 14 grupos), entao a resposta inteira

        cabe numa tela. O teto de 500 grupos e'' so uma trava de seguranca.


        Para as ocorrencias de um grupo, use `GET /findings?title=<titulo exato>`.'
      operationId: list_finding_groups_findings_groups_get
      security:
      - HTTPBearer: []
      parameters:
      - name: commit_sha
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filtra pelo SHA do commit.
          title: Commit Sha
        description: Filtra pelo SHA do commit.
      - name: amostra
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 0
          description: Quantos caminhos de exemplo trazer por grupo.
          default: 8
          title: Amostra
        description: Quantos caminhos de exemplo trazer por grupo.
      responses:
        '200':
          description: Tipos de vulnerabilidade com a contagem de ocorrencias.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingGroupList'
        '401':
          description: Token ausente, invalido ou expirado.
          content:
            application/json:
              example:
                detail: Credenciais invalidas ou token expirado.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /findings/{finding_id}:
    get:
      tags:
      - findings
      summary: Consultar finding por ID
      description: 'Retorna o detalhe de um finding do usuário. 404 se não existir ou não

        pertencer a um scan do usuário autenticado (não vaza existência).'
      operationId: get_finding_findings__finding_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: finding_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Finding Id
      responses:
        '200':
          description: Detalhe do finding, incluindo `raw_output`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingDetail'
        '401':
          description: Token ausente, invalido ou expirado.
          content:
            application/json:
              example:
                detail: Credenciais invalidas ou token expirado.
        '404':
          description: Finding nao encontrado.
          content:
            application/json:
              example:
                detail: Finding nao encontrado
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /scans:
    get:
      tags:
      - scans
      summary: Listar scans recentes
      description: Lista os scans do usuário logado, paginados (mais recentes primeiro).
      operationId: list_scans_scans_get
      security:
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanJobPage'
        '401':
          description: Token ausente, invalido ou expirado.
          content:
            application/json:
              example:
                detail: Credenciais invalidas ou token expirado.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /scans/{scan_id}:
    get:
      tags:
      - scans
      summary: Consultar um scan por id de execucao (ou commit)
      description: 'Retorna uma execução (uuid) ou a execução corrente de um commit (sha),

        com resumo de findings.


        O resumo é dos findings do **commit** — eles não são escopados por execução

        (reexecutar o mesmo commit analisa o mesmo código). Ver docs/pendencias.md.'
      operationId: get_scan_scans__scan_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: scan_id
        in: path
        required: true
        schema:
          type: string
          title: Scan Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanJobResponse'
        '401':
          description: Token ausente, invalido ou expirado.
          content:
            application/json:
              example:
                detail: Credenciais invalidas ou token expirado.
        '404':
          description: Scan nao encontrado.
          content:
            application/json:
              example:
                detail: Scan nao encontrado
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /scans/{scan_id}/report:
    get:
      tags:
      - scans
      summary: Listar relatorios de um scan (todos os tiers)
      description: 'Retorna os relatorios (um por tier) **daquela execução**.


        Passar o sha devolve os da execução corrente; passar o uuid devolve os

        daquela execução do histórico — é a diferença que torna o histórico útil.


        404 se o scan não existir ou não pertencer ao usuário. Lista vazia se o

        scan existe mas ainda não há relatórios (pipeline em andamento).'
      operationId: get_scan_reports_scans__scan_id__report_get
      security:
      - HTTPBearer: []
      parameters:
      - name: scan_id
        in: path
        required: true
        schema:
          type: string
          title: Scan Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanReportsResponse'
        '401':
          description: Token ausente, invalido ou expirado.
          content:
            application/json:
              example:
                detail: Credenciais invalidas ou token expirado.
        '404':
          description: Scan nao encontrado.
          content:
            application/json:
              example:
                detail: Scan nao encontrado
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /scans/{scan_id}/tools:
    get:
      tags:
      - scans
      summary: Listar o status de cada ferramenta do pipeline nesta execucao
      description: 'Retorna uma linha por ferramenta ja'' executada (ou pulada) nesta execucao.


        Complementa `tier{1,2,3}_status` do scan: o tier diz em que etapa o pipeline

        esta, isto diz o que aconteceu com cada ferramenta dentro dela — inclusive

        a diferenca entre "rodou e nao achou nada" (`status=done`,

        `findings_count=0`) e "quebrou" (`status=failed`, `reason` com o tipo da

        excecao), que antes se perdia no `return []` do `run_safe`.


        **Lista vazia e'' resposta legitima**, e significa uma de duas coisas: o

        pipeline ainda nao chegou a nenhuma ferramenta, ou a execucao e'' anterior a

        migration que criou a tabela (nada foi backfillado). Em ambos os casos o

        cliente cai para o status do tier — por isso `expected` sempre vem

        preenchido, mesmo quando `tools` esta vazio.


        `ia` traz o resumo da camada de I.A do Tier 3 quando existe relatorio desse

        tier (`None` caso contrario). E'' um resumo, nao o `analysis_json`: o blob

        carrega o array `findings` completo com `raw_output`, e esta rota e'' chamada

        uma vez por card da lista de Scans.'
      operationId: get_scan_tools_scans__scan_id__tools_get
      security:
      - HTTPBearer: []
      parameters:
      - name: scan_id
        in: path
        required: true
        schema:
          type: string
          title: Scan Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanToolsResponse'
        '401':
          description: Token ausente, invalido ou expirado.
          content:
            application/json:
              example:
                detail: Credenciais invalidas ou token expirado.
        '404':
          description: Scan nao encontrado.
          content:
            application/json:
              example:
                detail: Scan nao encontrado
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /scans/{scan_id}/tiers/{tier}/report:
    get:
      tags:
      - scans
      summary: Consultar relatorio de um tier especifico
      description: Retorna o relatorio de um tier (1-3) daquela execução, se for do usuário.
      operationId: get_scan_report_by_tier_scans__scan_id__tiers__tier__report_get
      security:
      - HTTPBearer: []
      parameters:
      - name: scan_id
        in: path
        required: true
        schema:
          type: string
          title: Scan Id
      - name: tier
        in: path
        required: true
        schema:
          type: integer
          maximum: 3
          minimum: 1
          title: Tier
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanReportResponse'
        '401':
          description: Token ausente, invalido ou expirado.
          content:
            application/json:
              example:
                detail: Credenciais invalidas ou token expirado.
        '404':
          description: Relatorio nao encontrado.
          content:
            application/json:
              example:
                detail: Relatorio nao encontrado
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /scans/{scan_id}/history:
    get:
      tags:
      - scans
      summary: Listar execucoes anteriores do mesmo commit
      description: 'Todas as execuções daquele commit, da mais recente para a mais antiga.


        Existe porque rescanear a mesma branch deixou de sobrescrever a execução

        anterior. A lista inclui a própria execução consultada.'
      operationId: get_scan_history_scans__scan_id__history_get
      security:
      - HTTPBearer: []
      parameters:
      - name: scan_id
        in: path
        required: true
        schema:
          type: string
          title: Scan Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanJobPage'
        '401':
          description: Token ausente, invalido ou expirado.
          content:
            application/json:
              example:
                detail: Credenciais invalidas ou token expirado.
        '404':
          description: Scan nao encontrado.
          content:
            application/json:
              example:
                detail: Scan nao encontrado
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /github/connect:
    get:
      tags:
      - github
      summary: Iniciar conexão com o GitHub
      description: 'Gera a URL de instalação do App com um `state` assinado (10 min).


        O front-end deve redirecionar o usuário para `install_url`. Retorna 503

        enquanto o App não estiver configurado (`GITHUB_APP_SLUG` vazio).'
      operationId: connect_github_connect_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectResponse'
        '401':
          description: Token ausente, invalido ou expirado.
          content:
            application/json:
              example:
                detail: Credenciais invalidas ou token expirado.
      security:
      - HTTPBearer: []
  /github/callback:
    get:
      tags:
      - github
      summary: Callback da instalação do GitHub App
      description: 'Recebe o redirect pós-instalação e vincula a instalação ao usuário.


        A identidade vem do `state` assinado (não do header JWT — é o browser do

        usuário que chega aqui). Faz upsert da `GithubAccount`.


        Quem chega aqui é um **browser**, não um cliente de API: com

        `GITHUB_CONNECT_REDIRECT_URL` configurada, um `state` inválido/expirado

        também redireciona (302) para o front, com `github=erro&motivo=state`, em

        vez de deixar o usuário num JSON de erro no host da API. Sem a URL

        configurada mantemos o `400`.'
      operationId: callback_github_callback_get
      parameters:
      - name: installation_id
        in: query
        required: true
        schema:
          type: integer
          title: Installation Id
      - name: state
        in: query
        required: true
        schema:
          type: string
          title: State
      - name: setup_action
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Setup Action
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '302':
          description: Redirect para `GITHUB_CONNECT_REDIRECT_URL` quando configurada. Em erro de `state`,
            com `github=erro&motivo=state` na query.
        '400':
          description: state ausente ou inválido (sem URL de redirect configurada).
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /github/repos:
    get:
      tags:
      - github
      summary: Listar repositórios disponíveis nas instalações do usuário
      description: 'Lista, ao vivo, os repositórios que as instalações do usuário enxergam.


        Para cada conta conectada, consulta o GitHub (installation token) e marca

        `active=True` nos repos que o usuário já ativou para análise. Falha ao

        consultar uma instalação é logada e ignorada (best-effort).'
      operationId: list_available_repos_github_repos_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AvailableRepo'
                type: array
                title: Response List Available Repos Github Repos Get
        '401':
          description: Token ausente, invalido ou expirado.
          content:
            application/json:
              example:
                detail: Credenciais invalidas ou token expirado.
      security:
