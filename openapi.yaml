  /repositories:
    get:
      tags:
      - repositories
      summary: Listar repositórios ativados
      description: Lista os repositórios GitHub ativados para análise pelo usuário logado.
      operationId: list_repositories_repositories_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/RepositoryResponse'
                type: array
                title: Response List Repositories Repositories Get
        '401':
          description: Token ausente, invalido ou expirado.
          content:
