[alembic]
script_location = alembic
prepend_sys_path = .

# DATABASE_URL é injetada pelo env.py via variável de ambiente.
# Este placeholder é ignorado em runtime.
sqlalchemy.url = postgresql+asyncpg://user:pass@localhost/aperia

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
