# Build da imagem e deploy na EC2.
#
# Sem chave SSH e sem porta 22 aberta: a AWS é acessada por OIDC (credencial de
# curta duração, nada guardado em secret) e o deploy vai por SSM Send Command.
# A role `aperia-github-deploy` só aceita este repositório no branch main, e só
# pode mandar comando para esta instância.
name: deploy

on:
  push:
    branches: [main]
    # Mudança só de documentação não precisa rebuildar 3,3 GB.
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  # Dois deploys ao mesmo tempo na mesma VM deixariam a imagem e o compose
  # fora de sincronia; o novo espera o anterior terminar.
  group: deploy-producao
  cancel-in-progress: false

env:
  IMAGEM: ghcr.io/aperia-org/python-api
  INSTANCIA: i-0faec7e207c3aa1f7
  REGIAO: us-east-1

permissions:
  contents: read
  packages: write
  id-token: write  # exigido pelo OIDC

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q

  publicar:
    needs: testes
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # A tag do commit é o que permite rollback: `latest` sozinho não
          # identifica para qual versão voltar.
          tags: |
            ${{ env.IMAGEM }}:latest
            ${{ env.IMAGEM }}:${{ github.sha }}
          # Cache entre execuções: sem ele, cada build recompila os scanners.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  implantar:
    needs: publicar
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::314068109572:role/aperia-github-deploy
          aws-region: us-east-1
      - name: Atualizar containers e migrar o banco
        run: |
          set -euo pipefail
          # `alembic upgrade head` antes de trocar os containers: o código novo
          # espera o schema novo. O compose e o .env vivem na VM, não aqui.
          id=$(aws ssm send-command \
            --instance-ids "$INSTANCIA" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA:0:7}" \
            --parameters 'commands=[
              "set -eux",
              "cd /home/ec2-user/aperia",
              "sudo -u ec2-user docker compose -f docker-compose.aws.yml pull -q api worker",
              "sudo -u ec2-user docker compose -f docker-compose.aws.yml run --rm api alembic upgrade head",
              "sudo -u ec2-user docker compose -f docker-compose.aws.yml up -d",
              "sudo -u ec2-user docker image prune -f"
            ]' \
            --query 'Command.CommandId' --output text)

          aws ssm wait command-executed --command-id "$id" --instance-id "$INSTANCIA" || true
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCIA" \
            --query '{status:Status,saida:StandardOutputContent,erro:StandardErrorContent}' --output json
          estado=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCIA" \
            --query Status --output text)
          [ "$estado" = "Success" ] || { echo "::error::deploy falhou: $estado"; exit 1; }

      - name: Conferir que a API respondeu
        run: |
          for _ in $(seq 1 12); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' https://api.aperiaspm.com.br/health)" = "200" ]; then
              echo "API no ar"; exit 0
            fi
            sleep 10
          done
          echo "::error::/health não respondeu 200 após o deploy"; exit 1
