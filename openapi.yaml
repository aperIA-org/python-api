      - HTTPBearer: []
  /repositories/{repository_id}:
    get:
      tags:
      - repositories
      summary: Detalhe de um repositório
      description: Retorna o detalhe de um repositório. 404 se não pertencer ao usuário.
      operationId: get_repository_repositories__repository_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: repository_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Repository Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryResponse'
        '401':
          description: Token ausente, invalido ou expirado.
          content:
            application/json:
              example:
                detail: Credenciais invalidas ou token expirado.
        '404':
          description: Repositorio nao encontrado.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - repositories
      summary: Atualizar repositório (ativação e/ou alvo de DAST)
      description: "Atualização **parcial**: aplica só os campos presentes no corpo.\n\n`404` se o repositório\
        \ não existir ou não pertencer ao usuário (nunca 403).\n\nSemântica do corpo — `active` e `target_url`\
        \ são independentes:\n\n- campo ausente → não é tocado;\n- `{\"active\": false}` → desativa (contrato\
        \ inalterado, é o que o\n  front-end já envia);\n- `{\"target_url\": \"https://staging.acme.com\"\
        }` → define o alvo do DAST;\n- `{\"target_url\": null}` → **limpa** o alvo (o Tier 3 volta a pular\
        \ o ZAP).\n\n`null` em `target_url` é valor legítimo, não omissão — por isso a rota\ndecide por\
        \ presença da chave (`model_fields_set`), não por \"veio `None`\".\nCorpo vazio e `{\"active\"\
        : null}` são `422` explícitos, para que um erro de\ncliente não passe como no-op silencioso.\n\
        \n## Por que `target_url` é validada com uma blocklist de rede\n\nO `target_url` não é um link\
        \ exibido na UI: ele é entregue ao OWASP ZAP,\nque faz spider e **active scan** — dispara payloads\
        \ reais de SQLi, XSS e\npath traversal contra tudo que encontrar. Aceitar URL arbitrária tem duas\n\
        consequências diretas:\n\n1. **Ataque não autorizado a terceiros.** Cadastrar o site de outra\n\
        \   empresa transformaria o aperIA na origem de um ataque, com o IP da\n   nossa infraestrutura\
        \ no log da vítima.\n2. **SSRF privilegiado.** O worker de Tier 3 roda dentro da nossa rede e\n\
        \   alcança o que o usuário não alcança. `http://127.0.0.1:8090` é o\n   próprio ZAP; `http://10.0.0.5`\
        \ é banco/Redis; e\n   `http://169.254.169.254` é o endpoint de metadata de AWS/GCP/Azure, que\n\
        \   devolve **credenciais IAM temporárias da instância** — que voltariam ao\n   usuário dentro\
        \ dos findings do relatório.\n\nPor isso só passa URL http/https absoluta, sem credenciais embutidas,\
        \ com\nhost público: são recusados `localhost`, `127.0.0.0/8`, RFC1918\n(`10/8`, `172.16/12`,\
        \ `192.168/16`), link-local `169.254.0.0/16` (o\nmetadata incluso), CGNAT `100.64.0.0/10`, ULA/loopback\
        \ IPv6, IPv4 mapeado\nem IPv6, as formas decimal/hexadecimal de IP (`http://2130706433`),\nsufixos\
        \ internos (`.local`, `.internal`, `.localhost`) e hosts de rótulo\núnico (`http://zap`), que\
        \ só existem dentro da rede do worker.\n\nO que a validação **não** cobre, deliberadamente: um\
        \ domínio público cujo\nDNS aponta para dentro (rebinding). Resolver DNS no cadastro seria TOCTOU\n\
        — o registro muda entre validar e escanear — então a defesa desse vetor é\nde rede (egress policy\
        \ no container do ZAP), não de schema."
      operationId: update_repository_repositories__repository_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: repository_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Repository Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepositoryUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryResponse'
        '401':
          description: Token ausente, invalido ou expirado.
          content:
            application/json:
              example:
                detail: Credenciais invalidas ou token expirado.
        '404':
          description: Repositorio nao encontrado.
        '422':
          description: 'Payload invalido (nenhum campo, `active: null` ou `target_url` recusada).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              examples:
                alvo_bloqueado:
                  summary: URL aponta para a rede interna
                  value:
                    detail:
                    - type: target_url_alvo_bloqueado
                      loc:
                      - body
                      - target_url
                      msg: 'Alvo bloqueado: 169.254.169.254 aponta para a rede interna. Informe a URL
                        publica do ambiente de staging/preview.'
                esquema_invalido:
                  summary: Esquema fora de http/https
                  value:
                    detail:
                    - type: target_url_esquema_invalido
                      loc:
                      - body
                      - target_url
                      msg: 'Esquema ''file'' nao e aceito: use http:// ou https://.'
    delete:
      tags:
      - repositories
      summary: Remover repositório
      description: Remove o vínculo do repositório. 404 se não pertencer ao usuário.
      operationId: delete_repository_repositories__repository_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: repository_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Repository Id
      responses:
        '204':
          description: Successful Response
        '401':
          description: Token ausente, invalido ou expirado.
          content:
            application/json:
              example:
                detail: Credenciais invalidas ou token expirado.
        '404':
          description: Repositorio nao encontrado.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /repositories/{repository_id}/scan:
    post:
      tags:
      - repositories
      summary: Iniciar scan manual do repositório
      description: "Dispara, sob demanda, o **mesmo** pipeline que o webhook de PR dispara.\n\nO commit\
        \ analisado é o HEAD do `default_branch` do repositório, resolvido\nao vivo no GitHub com o installation\
        \ token. Como não há PR, o pipeline roda\ncom `pr_number=None`: os relatórios ficam na projeção\
        \ da API em vez de\nvirarem comentário de PR.\n\nContrato de erros:\n\n- `404` se o repositório\
        \ não existir **ou** não pertencer ao usuário (nunca\n  403 — não vazamos a existência do recurso).\n\
        - `409` se o repositório estiver `active=false`. Desativado significa \"não\n  analisar\": um\
        \ scan manual aqui seria contraditório, e responder 404\n  esconderia do usuário um repositório\
        \ que ele mesmo pode reativar via\n  `PATCH /repositories/{id}`. Por isso 409 com mensagem explícita.\n\
        - `409` se já existir um `ScanJob` em andamento (algum tier `queued`/\n  `running`) para o commit\
        \ resolvido — evita duplicar o pipeline.\n- `502` se o GitHub não responder o HEAD do branch.\n\
        - `503` se o GitHub App não estiver configurado (mesmo espírito do\n  `GET /github/connect`, mas\
        \ aqui o que falta são as credenciais do App —\n  `GITHUB_APP_ID` / `GITHUB_PRIVATE_KEY_PATH`\
        \ — necessárias para emitir o\n  installation token)."
      operationId: trigger_repository_scan_repositories__repository_id__scan_post
      security:
      - HTTPBearer: []
      parameters:
      - name: repository_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Repository Id
      responses:
        '202':
          description: Pipeline disparado para o HEAD do branch default.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualScanResponse'
              example:
                status: queued
                commit_sha: 9b2e1f0a
                branch: main
        '401':
          description: Token ausente, invalido ou expirado.
          content:
            application/json:
              example:
                detail: Credenciais invalidas ou token expirado.
        '404':
          description: Repositorio nao encontrado.
        '409':
          description: Repositorio desativado, ou scan já em andamento para o commit.
          content:
            application/json:
              examples:
                desativado:
                  summary: Repositório desativado
                  value:
                    detail: 'Repositorio desativado: reative antes de iniciar um scan.'
                em_andamento:
                  summary: Scan já rodando para o mesmo commit
                  value:
                    detail: Ja existe um scan em andamento para o commit 9b2e1f0a.
        '502':
          description: Falha ao consultar o GitHub para resolver o HEAD do branch.
        '503':
          description: GitHub App nao configurado.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
