      title: ScanReportsResponse
      description: Lista de relatorios (um por tier) de UMA execucao.
    ScanToolRunResponse:
      properties:
        tier:
          type: integer
          title: Tier
        tool:
          type: string
          title: Tool
        status:
          type: string
          title: Status
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        findings_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Findings Count
        duration_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Duration Ms
        started_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Started At
        completed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completed At
      type: object
      required:
      - tier
      - tool
      - status
      - reason
      - findings_count
      - duration_ms
      - started_at
      - completed_at
      title: ScanToolRunResponse
      description: 'Desfecho de UMA ferramenta do pipeline dentro de uma execucao.


        `status` acompanha os valores de tier (`queued`/`running`/`done`/`failed`/

        `skipped`) e acrescenta `degraded`, que so existe no nivel da ferramenta:

        os passos de I.A caem para uma heuristica quando o Claude falha e o tier

        fecha como `done` mesmo assim.


        `findings_count` e'' `null` quando a ferramenta nao produz finding (I.A,

        threat intel, Caldera) — diferente de `0`, que significa "rodou e nao achou

        nada". Essa diferenca e'' justamente o que a tabela existe para guardar.'
    ScanToolsResponse:
      properties:
        scan_id:
          type: string
          format: uuid
          title: Scan Id
        commit_sha:
          type: string
          title: Commit Sha
        tools:
          items:
            $ref: '#/components/schemas/ScanToolRunResponse'
          type: array
          title: Tools
        expected:
          additionalProperties:
            items:
              type: string
            type: array
          type: object
          title: Expected
        ia:
          anyOf:
          - $ref: '#/components/schemas/ScanIaSummary'
          - type: 'null'
      type: object
      required:
      - scan_id
      - commit_sha
      - tools
      - expected
      title: ScanToolsResponse
      description: 'Ferramentas de UMA execucao, com o status de cada uma.


        `expected` lista os ids que o pipeline executa por tier — o cliente precisa

        dele para desenhar as ferramentas de um tier que ainda nao comecou (e que

        portanto nao tem linha nenhuma em `tools`). Sem isso o front teria que

        manter sua propria copia do catalogo e as duas iriam divergir.


        `ia` acrescenta o resumo da camada de I.A do Tier 3 (attack path, CTI,

        Caldera, risco ajustado) — compacto por necessidade, ver `ScanIaSummary`.'
    TokenResponse:
      properties:
        access_token:
          type: string
          title: Access Token
        refresh_token:
          type: string
          title: Refresh Token
        token_type:
          type: string
          title: Token Type
          default: bearer
      type: object
      required:
      - access_token
      - refresh_token
      title: TokenResponse
    UserCreate:
      properties:
        username:
          type: string
          maxLength: 255
          minLength: 1
          title: Username
        password:
          type: string
          maxLength: 128
          minLength: 8
          title: Password
        email:
          type: string
          maxLength: 500
          minLength: 3
          title: Email
      additionalProperties: false
      type: object
      required:
      - username
      - password
      - email
      title: UserCreate
    UserCreatedResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
      type: object
      required:
      - id
      title: UserCreatedResponse
    UserResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        username:
          type: string
          title: Username
        email:
          type: string
          title: Email
        created_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Created At
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated At
      type: object
      required:
      - id
      - username
      - email
      - created_at
      - updated_at
      title: UserResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
tags:
- name: health
  description: Verificação de disponibilidade do serviço.
- name: auth
  description: Autenticação e ciclo de vida de tokens (login, refresh com rotação, logout).
- name: users
  description: Criação e consulta de usuários.
- name: findings
  description: Consulta de findings de segurança persistidos pelo pipeline (protegido por JWT).
- name: scans
  description: Consulta do status/progresso do pipeline por commit (ScanJob) (protegido por JWT).
- name: github
  description: Conexão da conta GitHub (instalação do App) e repos disponíveis (protegido por JWT).
- name: repositories
  description: Gestão dos repositórios conectados para análise, isolados por usuário (protegido por JWT).
- name: webhook
  description: Recepção de eventos do GitHub que disparam o pipeline de segurança.
