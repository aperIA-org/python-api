# Config do Caldera montada em /usr/src/app/conf/local.yml.
#
# POR QUE EXISTE: a imagem gera `api_key_red` ALEATÓRIO a cada versão. Sem este
# arquivo, o servidor conhece uma chave que o `CalderaClient` não tem — todo
# request voltava 401 e o Tier 3 registrava `caldera_status=failed`. Como o
# valor nasce dentro da imagem, não havia como alinhar por default: é preciso
# fixar a chave de fora.
#
# VALORES SÃO DE DESENVOLVIMENTO. Mesma postura do `ZAP_API_KEY=changeme` no
# `.env.example`: o repositório versiona um valor que funciona de imediato e
# documenta que produção deve trocar. `crypt_salt` e `encryption_key` abaixo
# também são de dev — em produção, gere novos e não os versione.
#
# `api_key_red` precisa ser IGUAL a `CALDERA_API_KEY` no `.env` (default
# `aperia-dev-caldera-red` em `app/config.py`). Divergir volta o 401.
ability_refresh: 60
api_key_blue: aperia-dev-caldera-blue
api_key_red: aperia-dev-caldera-red
app.contact.dns.domain: mycaldera.caldera
app.contact.dns.socket: 0.0.0.0:8853
app.contact.ftp.host: 0.0.0.0
app.contact.ftp.port: 2222
app.contact.ftp.pword: caldera
app.contact.ftp.server.dir: ftp_dir
app.contact.ftp.user: caldera_user
app.contact.gist: API_KEY
app.contact.html: /weather
app.contact.http: http://0.0.0.0:8888
app.contact.slack.api_key: SLACK_TOKEN
app.contact.slack.bot_id: SLACK_BOT_ID
app.contact.slack.channel_id: SLACK_CHANNEL_ID
app.contact.tcp: 0.0.0.0:7010
app.contact.tunnel.ssh.host_key_file: REPLACE_WITH_KEY_FILE_PATH
app.contact.tunnel.ssh.host_key_passphrase: REPLACE_WITH_KEY_FILE_PASSPHRASE
app.contact.tunnel.ssh.socket: 0.0.0.0:8022
app.contact.tunnel.ssh.user_name: sandcat
app.contact.tunnel.ssh.user_password: s4ndc4t!
app.contact.udp: 0.0.0.0:7011
app.contact.websocket: 0.0.0.0:7012
auth.login.handler.module: default
crypt_salt: EGg3vOIXF-5WTAl8CoyRa2FqkDgA8oQ9uX4ROQDaiUk
encryption_key: VLRXUt8plbcSclWLZ8K2SHpevhbB500htxhq0GKcMtU
exfil_dir: /tmp/caldera
host: 0.0.0.0
objects.planners.default: atomic
plugins:
- access
- compass
- debrief
- fieldmanual
- manx
- response
- sandcat
- stockpile
- training
port: 8888
reachable_host_traits:
- remote.host.fqdn
- remote.host.ip
reports_dir: /tmp
requirements:
  go:
    command: go version
    type: installed_program
    version: 1.19
  python:
    attr: version
    module: sys
    type: python_module
    version: 3.8.0
users:
