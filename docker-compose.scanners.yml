# aperIA — scanners pesados (Tier 3)
#
# AVISO DE SEGURANÇA OPERACIONAL:
#   ▸ ``caldera_sandbox`` está em rede ``aperia_caldera_sandbox``
#     com ``internal: true`` — SEM rota de saída para internet ou
#     outras redes. Caldera executa técnicas MITRE ATT&CK reais;
#     isolamento de rede é o ÚNICO mecanismo que impede que
#     movimento lateral em testes escape para sistemas reais.
#   ▸ Nunca remover ``internal: true`` da ``aperia_caldera_sandbox``.
#   ▸ ``CALDERA_SANDBOX_MODE: "true"`` é validado no cliente Python;
#     remover essa env → ``SandboxViolationError`` no boot.
#
# COMO SUBIR — sempre com o MESMO conjunto de arquivos, variando só o perfil.
#
# Estes serviços estão atrás de `profiles:`, então NÃO sobem por padrão: um
# `up -d` sem perfil levanta apenas a stack base. Isso é deliberado por dois
# motivos, os dois observados na prática:
#
#   1. CARGA. Subir tudo (Postgres, Redis, API, 5 workers, ZAP, Caldera,
#      OpenCTI, Juice Shop) esgota os recursos do WSL2 e derruba até o DNS
#      embutido do Docker no meio de um scan.
#   2. REDE. Invocar `docker compose` com CONJUNTOS DIFERENTES de arquivos
#      recria `aperia_net` e deixa containers presos numa instância antiga de
#      mesmo nome — o worker perde resolução de `zap`/`caldera` sem que nada
#      no compose pareça errado. Com perfis, o conjunto de arquivos nunca muda.
#
# Rodando de dentro de `python-api/`, o conjunto de arquivos é sempre este; o
# que varia é o `--profile` acrescentado antes de `up -d`:
#
#   docker compose -f docker-compose.base.yml \
#                  -f docker-compose.scanners.yml \
#                  -f docker-compose.targets.yml \
#                  [--profile dast] [--profile emulation] [--profile cti] up -d
#
#   (nenhum perfil)       só a base — front, auth, pipeline T1/T2
#   --profile dast        + ZAP e Juice Shop        → Tier 3 com DAST
#   --profile emulation   + Caldera e o agente      → emulação MITRE ATT&CK
#   --profile cti         + OpenCTI                 → ver docs/pendencias.md §3

services:
  zap:
    # Tags <= 2.14.0 não existem neste repositório: o ZAP migrou de
    # owasp/zap2docker-stable para zaproxy/zap-stable só a partir do 2.15.0.
    image: zaproxy/zap-stable:2.16.1
    container_name: aperia-zap
    profiles: [dast]
    # A varredura ativa é o pico de consumo da stack. O teto evita que ela
    # sozinha leve o WSL2 junto — prefira o scan falhar a máquina travar.
    mem_limit: ${ZAP_MEM_LIMIT:-2g}
    command:
      # ⚠️  `-Xmx` PRECISA vir aqui, e precisa ser ~metade do `mem_limit`.
      #
      # Sem ele o container morria com `Exited (137)` (SIGKILL do cgroup) toda
      # vez que o active scan aquecia. A causa não é o ZAP ser guloso: é o
      # `zap.sh` dimensionar o heap pela memória ERRADA. Ele tenta ler o limite
      # do cgroup em `/sys/fs/cgroup/memory/memory.stat` — caminho de **cgroup
      # v1**. Docker no WSL2 (e qualquer host moderno) usa **cgroup v2**, onde
      # esse arquivo não existe; o script cai no fallback `MemTotal` do
      # /proc/meminfo, vê os 7.9 GB do HOST e resolve usar 1/4 disso:
      #
      #     Available memory: 7942 MB  →  -Xmx1985m   dentro de um limite de 2048m
      #
      # Heap de 1985m com teto de 2048m deixa 63 MB para metaspace, code cache,
      # stacks de thread e buffers diretos. A JVM não tem como fazer GC para
      # caber: ela cresce até o kernel matar. (A própria JVM 17 lê cgroup v2
      # certo — `MaxHeapSize` ergonômico dá 512m aqui —, mas o `-Xmx` do script
      # sobrescreve a ergonomia.)
      #
      # `zap.sh` varre os argumentos procurando `-Xmx*`: encontrando, adota o
      # valor do usuário e NÃO repassa o argumento ao jar. Daí ele vir antes de
      # `-daemon`. Confirme no boot com:
      #     docker logs aperia-zap | grep "Using JVM args"
      #
      # 1g = 50% do `mem_limit`, e a PROPORÇÃO é o que importa: a JVM precisa
      # de espaço comparável ao heap fora dele (metaspace, code cache, buffers
      # diretos, ~120 threads). Medido num scan do Juice Shop com o DOM XSS
      # desligado (ver ZAP_ASCAN_DISABLED_RULES): pico de 1.05 GiB no cgroup,
      # zero eventos de reclaim. Se subir o heap, suba `ZAP_MEM_LIMIT` na mesma
      # proporção — os dois andam juntos.
      - zap.sh
      - -Xmx${ZAP_JVM_HEAP:-1g}
      - -daemon
      - -host
      - 0.0.0.0
      - -port
      - "8090"
      - -config
      - api.addrs.addr.name=.*
      - -config
      - api.addrs.addr.regex=true
      - -config
      - api.key=${ZAP_API_KEY:-changeme}
    # A imagem traz um healthcheck que bate em `$ZAP_PORT`, e essa variável vem
    # assada como 8080 — mas o daemon aqui sobe na 8090. O container ficava
    # eternamente `unhealthy` servindo normalmente, o que é pior que não ter
    # healthcheck: esconde o dia em que ele estiver de fato quebrado.
    healthcheck:
      test:
        - CMD-SHELL
        - curl --silent --fail --output /dev/null http://localhost:8090/ || exit 1
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    ports:
      - "8090:8090"
    networks:
      - aperia_net

  opencti:
    image: opencti/platform:6.4.10
    container_name: aperia-opencti
    profiles: [cti]
    # NÃO reiniciar: falta um search engine na stack (docs/pendencias.md §3),
    # então ele nunca sobe. Com restart automático virava crash-loop
    # queimando CPU continuamente — custo real, benefício zero.
    restart: "no"
    mem_limit: 2g
    environment:
      APP__ADMIN__EMAIL: admin@aperia.local
      APP__ADMIN__PASSWORD: ${OPENCTI_ADMIN_PASSWORD:-changeme}
      APP__ADMIN__TOKEN: ${OPENCTI_TOKEN:-00000000-0000-4000-0000-000000000000}
      REDIS__HOSTNAME: redis
      REDIS__PORT: 6379
    depends_on:
      - redis
    ports:
      - "8081:8080"
    networks:
      - aperia_net

  caldera:
    image: ghcr.io/mitre/caldera:5.0.0
    container_name: aperia-caldera
    profiles: [emulation]
    mem_limit: 1g
    # A env `CALDERA_API_KEY` NÃO vive aqui. Ela é consumida pelo
    # `CalderaClient`, que roda no worker_tier3 — e o Caldera não lê essa
    # variável: ele lê `conf/local.yml`. Definida neste serviço, ela não fazia
    # nada, e a chave real (aleatória, assada na imagem) nunca batia com a do
    # cliente: todo request voltava 401.
    volumes:
      - ./caldera/local.yml:/usr/src/app/conf/local.yml:ro
    # A imagem 5.0.0 publicada quebra no boot com
    # `ValueError: No directory exists at '/usr/src/app/plugins/magma/dist/assets'`.
    # O `magma` é a INTERFACE WEB do Caldera: a imagem traz o código-fonte do
    # plugin mas não os assets compilados, e `rest_api.py` registra a rota
    # estática dele INCONDICIONALMENTE — tirar `magma` da lista de plugins do
    # `local.yml` não evita (ele já não está lá e o crash acontece assim mesmo).
    #
    # Só consumimos a API REST de emulação; a UI é irrelevante aqui. O tmpfs
    # cria o diretório vazio em memória, o que satisfaz a rota estática sem
    # precisar compilar uma interface que ninguém vai abrir e sem sujar o repo
    # com um diretório-placeholder.
    tmpfs:
      - /usr/src/app/plugins/magma/dist/assets
    ports:
      # Exposto APENAS para a rede interna; portas externas só para
      # debugging em dev — em prod, remover a publicação para que
      # apenas containers no aperia_net possam alcançar Caldera.
      - "8888:8888"
    networks:
      # CRÍTICO: dupla conexão — aperia_net (apenas para o worker
      # tier3 alcançar) + aperia_caldera_sandbox (rede interna onde
      # adversários simulam técnicas).
      - aperia_net
      - aperia_caldera_sandbox

  # ── Agente sandcat: o alvo que o Caldera de fato ataca ─────────────────────
  #
  # Sem agente, uma operação termina com cadeia VAZIA: `techniques_executed=0`
  # e `caldera_validated=False`. Parece "emulação não achou nada" quando na
  # verdade não havia onde executar.
  #
  # ⚠️  ESTE CONTAINER EXECUTA TÉCNICAS MITRE ATT&CK REAIS. Ele existe para ser
  #     atacado. Por isso está **somente** em `aperia_caldera_sandbox`, que é
  #     `internal: true` — sem rota para a internet nem para `aperia_net`.
  #     Não adicione outra rede aqui: o isolamento é o único mecanismo que
  #     impede movimento lateral de teste alcançar sistema real.
  #
  # Alpine porque o `wget` do busybox já vem embutido: a rede é `internal`, não
  # há como instalar nada em runtime. O sandcat é binário Go estático, roda
  # direto. `restart: unless-stopped` porque o agente precisa reconectar se o
  # Caldera reiniciar — sem ele, a operação seguinte encontra o grupo vazio.
  #
  # ⚠️  UM CONTAINER = UM AGENTE. O `-paw` é obrigatório, não cosmético.
  #
  # Sem ele o sandcat pede um PAW novo ao servidor em CADA boot, e como este
  # serviço reinicia sozinho, cada reinício registrava um agente A MAIS: chegou
  # a 20 agentes `red` para um único container. O estrago não é estético — uma
  # operação do Caldera roda cada ability em TODOS os agentes do grupo, então 3
  # abilities viraram 44 elos: 20× a execução de técnica de ataque real e um
  # `success_rate` calculado sobre uma amostra que não corresponde a alvo
  # nenhum. E piorava a cada `restart`.
  #
  # `-paw` fixo resolve na raiz: o servidor procura o agente pelo PAW do beacon
  # (`contact_svc.handle_heartbeat` → `locate('agents', paw=...)`) e, achando,
  # ATUALIZA o registro em vez de criar outro. Vale também quando o Caldera
  # reinicia: o store de agentes é em RAM, então ele recria o registro — com o
  # mesmo PAW, continua sendo um só.
  #
  # O `restart: unless-stopped` fica: ele é o que garante a reconexão depois de
  # um reinício do Caldera. Com o PAW fixo, reiniciar deixou de ter custo.
  #
  # Limpeza dos agentes órfãos de antes desta correção (roda no host, não aqui —
  # este container não tem, e não deve ter, a chave de API do Caldera):
  #     .venv/bin/python scripts/caldera_limpar_agentes.py --dry-run
  caldera-agent:
    image: alpine:3.20
    container_name: aperia-caldera-agent
    profiles: [emulation]
    mem_limit: 256m
    depends_on:
      - caldera
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        set -e
        # O download É o teste de prontidão. Usar `GET /` como probe não
        # funciona nesta imagem: ela responde 500 ("Template 'index.html' not
        # found") porque a UI magma não vem compilada — a mesma causa do crash
        # de boot que o tmpfs contorna. Esperar por um endpoint quebrado
        # deixaria o agente preso para sempre.
        echo "aguardando o Caldera servir o sandcat..."
        until wget -q -O /tmp/sandcat \
                --header='file:sandcat.go' \
                --header='platform:linux' \
                http://caldera:8888/file/download; do
          sleep 3
        done
        chmod +x /tmp/sandcat
        echo "conectando ao grupo ${CALDERA_AGENT_GROUP:-red} como ${CALDERA_AGENT_PAW:-aperia-sandbox}..."
        # `-paw` fixo = identidade estável entre reinícios. Ver o comentário do
        # serviço acima; o servidor sanitiza o PAW para `[\w.\-]`, então nada
        # fora desse conjunto sobrevive à viagem.
        exec /tmp/sandcat -server http://caldera:8888 \
                          -group ${CALDERA_AGENT_GROUP:-red} \
                          -paw ${CALDERA_AGENT_PAW:-aperia-sandbox}
    networks:
      - aperia_caldera_sandbox

networks:
  # Rede isolada — sem rota para internet ou outras redes Docker.
  # Targets simulados (agentes Caldera) só conseguem se comunicar
  # com o servidor Caldera dentro desta rede.
  aperia_caldera_sandbox:
    driver: bridge
    internal: true
    name: aperia_caldera_sandbox
